<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แปลงเงินบาท → กีบ / ดอลลาร์</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f27;--muted:#667085;--line:#e3e6eb;--accent:#0b6bcb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13161b;--card:#1d222a;--text:#eef0f3;--muted:#98a2b3;--line:#2e3540;--accent:#5aa7ff}}
:root[data-theme="dark"]{--bg:#13161b;--card:#1d222a;--text:#eef0f3;--muted:#98a2b3;--line:#2e3540;--accent:#5aa7ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:480px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.3rem;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.row{display:flex;gap:8px}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;box-sizing:border-box}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
#amount{font-size:1.4rem;font-weight:600}
select{width:auto;min-width:96px}
.res{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line)}
.res:last-child{border:0}
.res b{font-size:1.35rem;font-variant-numeric:tabular-nums;word-break:break-all;text-align:right}
.res span{color:var(--muted)}
.rates{display:grid;gap:10px}
.rate{display:flex;align-items:center;gap:8px;font-size:.95rem}
.rate input{width:110px;padding:8px}
small{color:var(--muted);display:block;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>💱 แปลงค่าเงิน บาท · กีบ · ดอลลาร์</h1>

<div class="card">
  <label for="amount">จำนวนเงิน</label>
  <div class="row">
    <input id="amount" type="number" inputmode="decimal" value="1000" min="0">
    <select id="from" aria-label="สกุลเงินต้นทาง">
      <option value="THB">THB บาท</option>
      <option value="LAK">LAK กีบ</option>
      <option value="USD">USD ดอลลาร์</option>
    </select>
  </div>
</div>

<div class="card" id="results"></div>

<div class="card">
  <label>อัตราแลกเปลี่ยน (แก้ไขได้)</label>
  <div class="rates">
    <div class="rate">1 บาท = <input id="rLAK" type="number" inputmode="decimal" step="any"> กีบ</div>
    <div class="rate">1 ดอลลาร์ = <input id="rUSD" type="number" inputmode="decimal" step="any"> บาท</div>
  </div>
  <small>อัตราเริ่มต้นเป็นค่ากลางโดยประมาณ ณ วันที่ 24 ต.ค. 2569 (1 บาท ≈ 690 กีบ, 1 ดอลลาร์ ≈ 33.27 บาท) อัตราจริงของธนาคารหรือร้านแลกเงินจะต่างออกไป กรุณาแก้ตัวเลขให้ตรงกับอัตราที่ใช้จริง</small>
</div>
</main>

<script>
(function(){
  var DEF={lak:690,usd:33.27};
  var $=function(id){return document.getElementById(id)};
  var rLAK=$("rLAK"),rUSD=$("rUSD"),amt=$("amount"),from=$("from"),out=$("results");
  try{
    var s=JSON.parse(localStorage.getItem("rates")||"null");
    if(s&&s.lak>0&&s.usd>0){DEF=s}
  }catch(e){}
  rLAK.value=DEF.lak;rUSD.value=DEF.usd;

  var fmt={
    THB:function(n){return n.toLocaleString("th-TH",{maximumFractionDigits:2})},
    LAK:function(n){return n.toLocaleString("th-TH",{maximumFractionDigits:0})},
    USD:function(n){return n.toLocaleString("en-US",{maximumFractionDigits:2})}
  };
  var names={THB:"บาท (THB)",LAK:"กีบ (LAK)",USD:"ดอลลาร์ (USD)"};

  function calc(){
    var lak=parseFloat(rLAK.value),usd=parseFloat(rUSD.value),a=parseFloat(amt.value);
    if(!(lak>0)||!(usd>0)||!(a>=0)){out.innerHTML='<span style="color:var(--muted)">กรอกจำนวนเงินและอัตราแลกเปลี่ยนให้ถูกต้อง</span>';return}
    var perTHB={THB:1,LAK:lak,USD:1/usd};
    var thb=a/perTHB[from.value];
    var html="";
    ["THB","LAK","USD"].forEach(function(c){
      if(c===from.value)return;
      html+='<div class="res"><span>'+names[c]+'</span><b>'+fmt[c](thb*perTHB[c])+'</b></div>';
    });
    out.innerHTML=html;
    try{localStorage.setItem("rates",JSON.stringify({lak:lak,usd:usd}))}catch(e){}
  }
  [rLAK,rUSD,amt,from].forEach(function(el){el.addEventListener("input",calc);el.addEventListener("change",calc)});
  calc();
})();
</script>
</body>
</html>
